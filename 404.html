<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found - Apex Loans</title>
  <meta name="description" content="Sorry, the requested lending page could not be located.">
  <!-- Fonts & Styles -->
  <link rel="stylesheet" href="css/style-v3.css?v=3.5">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- 404 Content Container -->
  <main class="error-page-container">
    
    <div class="error-number">404</div>
    
    <!-- CSS illustration floating animation -->
    <div style="font-size: 5rem; margin-bottom: 20px; color: #FFB800; animation: float 3s ease-in-out infinite;">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    
    <h1 class="error-message">Lost in the Borrowing Portal?</h1>
    <p class="error-description">The loan application page, EMI calculator section, or user portal you are searching for is in a different sector or has been moved!</p>
    
    <div class="error-btns">
      <button onclick="window.history.back()" class="btn btn-secondary" style="border-color:#FFFFFF; color:#FFFFFF; background:transparent;"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
      <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
    </div>
    
  </main>

  <script src="js/script.js"></script>
</body>
</html>
